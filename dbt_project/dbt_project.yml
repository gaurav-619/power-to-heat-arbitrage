name: "celsio_prototype"
version: "1.0.0"
config-version: 2
profile: "celsio_prototype"

model-paths: ["models"]
target-path: "target"
log-path: "logs"
clean-targets: ["target", "logs"]

# NOTE: all paths below are relative to this file's directory (dbt_project/).
# Run dbt commands from inside dbt_project/, e.g.: cd dbt_project && dbt run
vars:
  data_dir: "../data/processed"
  config_dir: "../config"

models:
  celsio_prototype:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
